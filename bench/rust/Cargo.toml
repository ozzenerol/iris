[package]
name = "bench"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["http2"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
serde = { version = "1", features = ["derive"] }
async-channel = "2"
num-bigint = "0.4"
quick-xml = "0.38"
toml = "0.9"
zip = { version = "4", default-features = false, features = ["deflate"] }
crc32fast = "1"
tar = "0.4"
minijinja = "2"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
ctr = "0.9"
chacha20 = "0.9"
crc32c = "0.6"
data-encoding = "2"
ring = "0.17"
x509-parser = "0.18"
serde_yaml = "0.9"
russh = "0.65"
russh-sftp = "3"
rumqttd = "0.20"
rumqttc = "0.25"
rand = "0.10"
prost = "0.14"
rmp-serde = "1"
ciborium = "0.2"
tonic = "0.14"
tonic-prost = "0.14"
http = "1"
tower-service = "0.3"
aws-sigv4 = "1"
aws-credential-types = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "derive"] }
prometheus = { version = "0.14", default-features = false }
opentelemetry-proto = { version = "0.31", default-features = false, features = ["trace", "gen-tonic-messages", "with-serde"] }
serde_json = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
bson = "2"
mongodb = "3"
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "binary-trees"
path = "../binary-trees/main.rs"

[[bin]]
name = "channels"
path = "../channels/main.rs"

[[bin]]
name = "fannkuch-redux"
path = "../fannkuch-redux/main.rs"

